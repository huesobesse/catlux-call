<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatLux · Llamada a mesa</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--tx:#1c2a24;--mut:#66726b;--bd:#ddd9cc;--pri:#1d5a43;--w:#2d6bd0;--b:#c4741a;--c:#7a3db0;--ok:#1f8a4c;--late:#fbe3e0}
@media (prefers-color-scheme:dark){:root{--bg:#121916;--card:#1c2521;--tx:#eef2ef;--mut:#97a39b;--bd:#2c3731;--pri:#4fb587;--w:#6ea2f5;--b:#e8a24d;--c:#b88ae6;--ok:#4fd083;--late:#3a1f1d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.big{display:block;width:100%;border:0;border-radius:18px;padding:22px 18px;margin:12px 0;font-size:22px;font-weight:700;color:#fff;text-align:left;cursor:pointer}
.big small{display:block;font-size:14px;font-weight:400;opacity:.92;margin-top:2px}
.big:disabled{opacity:.45;cursor:not-allowed}
.bw{background:var(--w)}.bb{background:var(--b)}.bc{background:var(--c)}
.toast{background:var(--ok);color:#fff;border-radius:12px;padding:12px;font-weight:600;text-align:center}
.err{color:#c0392b;font-size:14px}
input{font-size:16px;padding:12px;border:1px solid var(--bd);border-radius:10px;width:100%;margin:6px 0;background:var(--card);color:var(--tx)}
.btn{border:0;background:var(--pri);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-left:8px solid var(--mut);border-radius:14px;padding:12px;margin:8px 0}
.row.w{border-left-color:var(--w)}.row.b{border-left-color:var(--b)}.row.c{border-left-color:var(--c)}
.row.late{background:var(--late)}
.n{font-size:26px;font-weight:800;min-width:52px}
.i{flex:1}.i div{font-weight:600}.i span{font-size:13px;color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--mut);padding:30px 0}

.menu{margin-top:28px}.menu h2{font-size:22px;margin:0 0 8px}
.menu h3{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--pri);margin:22px 0 6px;padding-top:6px;border-top:1px solid var(--bd)}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.mchips .chip{white-space:nowrap}
.mi{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dotted var(--bd)}
.mi b{white-space:nowrap}.md{font-size:13px;color:var(--mut);margin:-4px 0 6px}
.note{font-size:12px;color:var(--mut);margin:16px 0 30px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, doc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== 1. PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAGadPJreGEM5CNXhEmWKDQYWHnb8hA_7Y",
  authDomain: "catlux-call.firebaseapp.com",
  projectId: "catlux-call",
  appId: "1:842726521109:web:78ab0d5cd0762347a0111c"
};
/* ===== 2. EDIT YOUR ZONES: [name, first table, last table] ===== */
const ZONES = [["Salón", 1, 10], ["Comedor", 11, 20], ["Piscina", 21, 26], ["Deck 1", 27, 32], ["Deck 2", 33, 38], ["Deck 3", 39, 44]];
const COOLDOWN_MS = 60000, LATE_MS = 180000;
/* ===== 3. WAITERS: login email -> areas they see. Anyone NOT listed sees all areas (bar / managers). =====
   Example lines (remove the // to use):
   "juan@catlux.bo": ["Deck 1", "Deck 2"],
   "maria@catlux.bo": ["Salón", "Comedor"],   */
const STAFF = {
  "treicy@catlux.bo":   ["Salón"],
  "araceli@catlux.bo":  ["Salón"],
  "johana@catlux.bo":   ["Salón"],
  "alba@catlux.bo":     ["Comedor"],
  "meliza@catlux.bo":   ["Comedor"],
  "ria@catlux.bo":      ["Comedor"],
  "fernando@catlux.bo": ["Piscina"],
  "ariel@catlux.bo":    ["Piscina"],
  "bryan@catlux.bo":    ["Deck 1"],
  "limbert@catlux.bo":  ["Deck 1"],
  "iris@catlux.bo":     ["Deck 2"],
  "madai@catlux.bo":    ["Deck 2"],
  "naire@catlux.bo":    ["Deck 3"],
  "jesus@catlux.bo":    ["Deck 3"],
  "hermes@catlux.bo":   ["Piscina", "Deck 1"],
  "wendy@catlux.bo":    ["Salón"]
};

const TYPES = {
  w: { en: "Call waiter", es: "Llamar al mesero", c: "w" },
  b: { en: "Order drinks", es: "Pedir bebidas / bar", c: "b" },
  c: { en: "Request check", es: "Pedir la cuenta", c: "c" }
};
const app = document.getElementById("app");
const fb = initializeApp(firebaseConfig), db = getFirestore(fb), auth = getAuth(fb);
const zoneOf = t => (ZONES.find(z => t >= z[1] && t <= z[2]) || ["Other"])[0];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let unsub = null, calls = [], zone = "All", sound = false, user = null, actx = null, seen = {}, first = true, tick = null;

const MENU = [
 {c:"Entradas", i:[["Haba con Quesillo",15],["Choclo con Quesillo",15]]},
 {c:"Sopas", i:[["Sopa de Maní",15]]},
 {c:"Pescados", i:[["Chicharrón de Surubí",70],["Cabañitas de Surubí",70],["Trucha a la Mantequilla",75],["Trucha a la Romana",75],["Trucha en Salsa Thai",75],["Ceviche",40]]},
 {c:"Platos fuertes", i:[["Filet Mignon",80],["Steak a la Pimienta",80],["Lomo con Champiñones",70],["Lomo con Puré y Chorellana",70],["Lomo Montado",70],["Lomo Borracho",70],["Lomo Country",70],["Milanesa Napolitana de Res",65],["Milanesa Country",70],["Milanesa de Res",60]]},
 {c:"Pollo", i:[["Milanesa Napolitana de Pollo",60],["Milanesa de Pollo",55],["Pollo a la Plancha",55],["Pique Macho de Pollo",55],["Chanka de Pollo",35],["Chicken Finger",40],["Alitas de Pollo",45],["Pipocas de Pollo",35]]},
 {c:"Nacionales", i:[["Picante de Lengua",65],["Picante de Pollo",65],["Picante de Lapping",65],["Pique Mixto",70],["Pique Macho de Lomo",75],["Pique Macho de Lapping",65]]},
 {c:"Comida rápida", i:[["Hamburguesa con Queso",29],["Hamburguesa con Queso y Tocino",33],["Sándwich Philadelphia",35],["Sándwich Club",34],["Sándwich de Lomo",30],["Súper Burrito",35]]},
 {c:"Especialidad de la casa", i:[["Pique CatLux",145,"Para 3 personas"]]},
 {c:"Pastas", i:[["Tallarín Bolognesa",45],["Tallarín con Albóndigas",45],["Fettuccine Alfredo con Pollo",55]]},
 {c:"Ensaladas", i:[["Ensalada César con Pollo",35],["Ensalada Jardinera con Pollo",40],["Ensalada Jardinera con Atún",45]]},
 {c:"Cervezas", i:[["Huari",27],["Paceña",25],["Corona",25],["Stella Artois",25],["Balde de Corona (6 unidades)",120]]},
 {c:"Gaseosas", i:[["Coca-Cola",10],["Coca-Cola Zero",10],["Fanta",10],["Sprite",10],["Pepsi",10],["Pepsi Black",10],["Guaraná",10]]},
 {c:"Botellas", i:[["Fernet",230],["Singani",230],["Gin Flamboyant",280],["Whisky Etiqueta Roja",500],["Whisky Etiqueta Negra",700]]}
];
const menuHTML = () => `<div class="menu"><h2>Carta</h2><div class="mchips">${MENU.map((m, i) => `<button class="chip" data-m="${i}">${m.c}</button>`).join("")}</div>` +
  MENU.map((m, i) => `<section id="m${i}"><h3>${m.c}</h3>${m.i.map(x => `<div class="mi"><span>${x[0]}</span><b>Bs ${x[1]}</b></div>${x[2] ? `<div class="md">${x[2]}</div>` : ""}`).join("")}</section>`).join("") +
  `<p class="note">Precios en bolivianos (Bs) · Consulte por menús para eventos y servicio de catering</p></div>`;
const bindMenu = () => app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { const e = document.getElementById("m" + b.dataset.m); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }); });
function menuPage() { app.innerHTML = '<h1>CatLux · Carta</h1><p class="sub">Sabores de autor · Servicio de excelencia</p>' + menuHTML(); bindMenu(); }
function route() {
  if (unsub) { unsub(); unsub = null; }
  clearInterval(tick);
  const h = location.hash.slice(1), m = h.match(/^t-(\d{1,2})$/);
  if (h === "staff") return staff();
  if (h === "menu") return menuPage();
  if (m && +m[1] >= 1) return guest(+m[1]);
  app.innerHTML = '<h1>CatLux · Llamada a mesa</h1><p class="sub">Escanee el código QR de su mesa para llamar al mesero.</p>';
}
addEventListener("hashchange", route);

/* ---------- Guest ---------- */
function guest(t) {
  let msg = "", err = "";
  const draw = () => {
    const y = window.scrollY;
    app.innerHTML = `<h1>Mesa ${t}</h1><p class="sub">${zoneOf(t)} · Country Club</p>` +
      (msg ? `<div class="toast">${msg}</div>` : "") + (err ? `<p class="err">${err}</p>` : "") +
      Object.keys(TYPES).map(k => {
        const wait = Date.now() - (+localStorage.getItem("cd" + t + k) || 0) < COOLDOWN_MS;
        return `<button class="big b${TYPES[k].c}" data-k="${k}" ${wait ? "disabled" : ""}>${TYPES[k].es}<small>${TYPES[k].en}${wait ? " · enviado, espere / sent, please wait" : ""}</small></button>`;
      }).join("") + menuHTML();
    bindMenu();
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => send(b.dataset.k));
    window.scrollTo(0, y);
  };
  const send = async k => {
    try { localStorage.setItem("cd" + t + k, Date.now()); } catch (e) {}
    err = "";
    try {
      await addDoc(collection(db, "calls"), { table: t, type: k, ts: Date.now(), done: false });
      msg = `${TYPES[k].es}: enviado ✓ Alguien va en camino. (${TYPES[k].en} sent)`;
    } catch (e) { err = "No se pudo enviar. Por favor llame al mesero. (Could not send.)"; }
    draw(); setTimeout(() => { msg = ""; draw(); }, 5000); setTimeout(draw, COOLDOWN_MS + 200);
  };
  draw();
}

/* ---------- Staff ---------- */
function beep() {
  if (!sound) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.frequency.value = 880; g.gain.value = .25; o.start(); o.stop(actx.currentTime + .3); } catch (e) {}
}
const ago = ts => { const s = Math.max(0, Math.floor((Date.now() - ts) / 1000)); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; };

const myZones = () => { const m = STAFF[((user && user.email) || "").toLowerCase()]; return Array.isArray(m) ? m : ZONES.map(z => z[0]); };
const mine = t => myZones().includes(zoneOf(t));
const zoneChips = () => myZones().length > 1 ? ["All", ...myZones()] : [];
function staff() {
  if (!user) return login();
  unsub = onSnapshot(query(collection(db, "calls"), orderBy("ts", "desc"), limit(150)), snap => {
    calls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const fresh = calls.some(c => !c.done && !seen[c.id] && mine(c.table));
    calls.forEach(c => seen[c.id] = 1);
    if (!first && fresh) beep(); first = false;
    drawStaff();
  }, () => { app.innerHTML = '<p class="err">Sin acceso. Ingrese de nuevo.</p>'; });
  tick = setInterval(drawStaff, 1000);
}
function drawStaff() {
  const open = calls.filter(c => !c.done && mine(c.table) && (zone === "All" || zoneOf(c.table) === zone)).sort((a, b) => a.ts - b.ts);
  app.innerHTML = `<div class="bar"><h1>Llamadas pendientes</h1><div><button class="chip ${sound ? "on" : ""}" id="snd">${sound ? "🔔 Sonido activado" : "🔕 Sonido apagado"}</button> <button class="chip" id="out">Cerrar sesión</button></div></div>` +
    `<div class="chips">${zoneChips().map(z => `<button class="chip ${zone === z ? "on" : ""}" data-z="${esc(z)}">${z === "All" ? "Todos" : esc(z)}</button>`).join("")}</div>` +
    (open.length ? open.map(c => { const T = TYPES[c.type] || TYPES.w;
      return `<div class="row ${T.c} ${Date.now() - c.ts > LATE_MS ? "late" : ""}"><div class="n">${+c.table}</div><div class="i"><div>${T.es}</div><span>${zoneOf(c.table)} · esperando ${ago(c.ts)}</span></div><button class="btn" data-id="${esc(c.id)}">Listo</button></div>`; }).join("")
      : '<div class="empty">Sin llamadas pendientes ✓</div>');
  app.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { zone = b.dataset.z; drawStaff(); });
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => updateDoc(doc(db, "calls", b.dataset.id), { done: true }));
  document.getElementById("snd").onclick = () => { sound = !sound; if (sound) beep(); drawStaff(); };
  document.getElementById("out").onclick = () => signOut(auth);
}
function login() {
  app.innerHTML = `<h1>Ingreso del personal</h1><p class="sub">CatLux · Country Club</p><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" id="go">Ingresar</button><p class="err" id="er"></p>`;
  document.getElementById("go").onclick = async () => {
    try { await signInWithEmailAndPassword(auth, document.getElementById("em").value.trim(), document.getElementById("pw").value); }
    catch (e) { document.getElementById("er").textContent = "Correo o contraseña incorrectos."; }
  };
}
onAuthStateChanged(auth, u => { user = u; route(); });
</script>
</body>
</html>
